services:
  api:
    image: python:3.12-slim
    working_dir: /workspace
    command: >-
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/workspace
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    image: node:24-bookworm-slim
    working_dir: /workspace
    command: >-
      sh -c "npm ci &&
      npm run dev -- --port 5173"
    volumes:
      - ./app:/workspace
      - frontend_node_modules:/workspace/node_modules
    ports:
      - "5173:5173"
    environment:
      SENTINEL_VITE_HOST: 0.0.0.0
      SENTINEL_API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  frontend_node_modules:
