services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: sentinel-explorer-api:preview
    restart: unless-stopped
    environment:
      SENTINEL_APP_VERSION: "0.1.0-preview"
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; r=urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2); assert r.status == 200"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ..
      dockerfile: app/Dockerfile
    image: sentinel-explorer-web:preview
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - target: 8080
        published: "${SENTINEL_PREVIEW_HTTP_PORT:-8080}"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test:
        - CMD-SHELL
        - "nginx -t >/dev/null 2>&1 && test -s /usr/share/nginx/html/index.html"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
