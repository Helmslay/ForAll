name: Sentinel Control Command Approval

on:
  workflow_dispatch:
    inputs:
      request_sha256:
        description: "SHA-256 of the exact raw JSON body in the private Sentinel Issue"
        required: true
        type: string
      title_sha256:
        description: "SHA-256 of the exact [APPROVED] Issue title in the private Sentinel Issue"
        required: true
        type: string
      issue_binding_sha256:
        description: "Opaque SHA-256 binding this approval to one private Issue identity; do not enter an Issue number"
        required: true
        type: string
      release_tag:
        description: "Fresh random sentinel-command- plus 32 lowercase hex characters"
        required: true
        type: string
      confirmation:
        description: "Approve only this exact hash-bound request"
        required: true
        type: choice
        options:
          - CANCEL
          - I_APPROVE
        default: CANCEL
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: sentinel-command-approval-${{ github.event_name == 'issues' && github.event.issue.id || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  attest:
    if: >-
      github.repository == 'Helmslay/ForAll' &&
      github.repository_id == '1461236096' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'Helmslay/ForAll/.github/workflows/sentinel-control-command-approval.yml@refs/heads/main' &&
      github.actor == 'Helmslay' &&
      github.actor_id == '151124217' &&
      github.run_attempt == 1 &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirmation == 'I_APPROVE') ||
      (github.event_name == 'issues' && github.event.action == 'opened' &&
       github.event.issue.user.id == 151124217 &&
       startsWith(github.event.issue.title, 'Sentinel command relay ')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create hash-only attestation
        shell: bash
        env:
          REQUEST_SHA256: ${{ inputs.request_sha256 || '' }}
          TITLE_SHA256: ${{ inputs.title_sha256 || '' }}
          ISSUE_BINDING_SHA256: ${{ inputs.issue_binding_sha256 || '' }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
          CONFIRMATION: ${{ inputs.confirmation || '' }}
        run: |
          set -Eeuo pipefail
          python3 tools/sentinel_control_relay/approval.py create --output "$RUNNER_TEMP/approval-attestation.json"
          python3 - "$RUNNER_TEMP/approval-attestation.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          event_name = os.environ["GITHUB_EVENT_NAME"]
          if event_name == "issues":
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
              expected = json.loads(event["issue"]["body"])
          else:
              expected = {
                  "release_tag": os.environ["RELEASE_TAG"],
                  "issue_binding_sha256": os.environ["ISSUE_BINDING_SHA256"],
                  "request_sha256": os.environ["REQUEST_SHA256"],
                  "title_sha256": os.environ["TITLE_SHA256"],
              }
          if (
              value.get("status") != "approved"
              or value.get("release_tag") != expected["release_tag"]
              or value.get("issue_binding_sha256") != expected["issue_binding_sha256"]
              or value.get("request_sha256") != expected["request_sha256"]
              or value.get("title_sha256") != expected["title_sha256"]
          ):
              raise SystemExit("attestation_binding_failed")
          PY

      - name: Publish one-time public attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_PATH: ${{ runner.temp }}/approval-attestation.json
        run: |
          set -Eeuo pipefail
          RELEASE_TAG="$(python3 - "$ATTESTATION_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["release_tag"])
          PY
          )"
          [[ "$RELEASE_TAG" =~ ^sentinel-command-[0-9a-f]{32}$ ]] || { echo "release_tag_invalid" >&2; exit 2; }
          export RELEASE_TAG
          gh release create "$RELEASE_TAG" "$ATTESTATION_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sentinel command approval $GITHUB_RUN_ID" \
            --notes "Opaque hash-bound approval attestation only. No private Issue identifiers, title, body or command arguments are published." \
            --prerelease \
            --target "$GITHUB_SHA"

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,isDraft,isPrerelease,assets \
            > "$RUNNER_TEMP/release-view.json"

          python3 - "$RUNNER_TEMP/release-view.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assets = value.get("assets")
          if (
              value.get("tagName") != os.environ["RELEASE_TAG"]
              or value.get("targetCommitish") != os.environ["GITHUB_SHA"]
              or value.get("isDraft") is not False
              or value.get("isPrerelease") is not True
              or not isinstance(assets, list)
              or len(assets) != 1
              or assets[0].get("name") != "approval-attestation.json"
          ):
              raise SystemExit("release_verification_failed")
          PY
