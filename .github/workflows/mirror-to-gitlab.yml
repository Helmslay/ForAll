name: Mirror repository to GitLab

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror all Git refs
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${GITLAB_MIRROR_TOKEN}" ]]; then
            echo "GITLAB_MIRROR_TOKEN is not configured; skipping mirror."
            exit 0
          fi
          git clone --mirror "https://github.com/${GITHUB_REPOSITORY}.git" repository.git
          cd repository.git
          git remote add gitlab "https://oauth2:${GITLAB_MIRROR_TOKEN}@gitlab.com/kuncevichles-group/forall-backup.git"
          git push --mirror gitlab
