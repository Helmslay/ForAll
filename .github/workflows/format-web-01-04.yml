name: Format WEB-01.04 files

on:
  push:
    branches:
      - feat/web-01-04-app-shell
    paths:
      - ".github/workflows/format-web-01-04.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Format Vue and CSS sources
        working-directory: app
        run: |
          npm ci
          npx prettier --write src/App.vue src/style.css
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/App.vue app/src/style.css
          if ! git diff --cached --quiet; then
            git commit -m "style(web): apply Prettier to app shell"
            git push origin HEAD:feat/web-01-04-app-shell
          fi
