name: Frontend build

on:
  pull_request:
    paths:
      - "app/**"

permissions:
  contents: write

concurrency:
  group: frontend-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Generate and commit npm lockfile
        working-directory: app
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- app/package-lock.json)" ]; then
            git add app/package-lock.json
            git commit -m "chore(web): generate npm lockfile"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Install locked dependencies
        working-directory: app
        run: npm ci

      - name: Lint frontend
        working-directory: app
        run: npm run lint

      - name: Capture canonical formatting for existing scaffold
        working-directory: app
        shell: bash
        run: |
          npx prettier --write src/App.spec.ts src/App.vue src/style.css
          git diff -- src/App.spec.ts src/App.vue src/style.css

      - name: Check formatting
        working-directory: app
        run: npm run format:check

      - name: Typecheck frontend
        working-directory: app
        run: npm run typecheck

      - name: Run unit tests
        working-directory: app
        run: npm test

      - name: Build production frontend
        working-directory: app
        run: npm run build

      - name: Smoke-check Vite development server
        working-directory: app
        shell: bash
        run: |
          npm run dev -- --port 4173 --strictPort > /tmp/sentinel-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /tmp/sentinel-dev.html; then
              break
            fi
            sleep 1
          done
          grep -q '<div id="app"></div>' /tmp/sentinel-dev.html
