name: Frontend build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "backend/**"
      - "deployment/**"
      - ".dockerignore"
      - "compose.yaml"
      - ".github/workflows/frontend-build.yml"
      - ".github/workflows/sentinel-control-approval-relay.yml"
  pull_request:
    paths:
      - "app/**"
      - "backend/**"
      - "deployment/**"
      - ".dockerignore"
      - "compose.yaml"
      - "docs/LOCAL_DEVELOPMENT.md"
      - "docs/START_HERE.md"
      - "docs/STATUS.md"
      - "docs/EXECUTION_PLAN.md"
      - "docs/tasks/PHASE_01_FOUNDATION.md"
      - "docs/tasks/PHASE_03_CATALOG.md"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact 40-character commit SHA to build"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.event.pull_request.number || inputs.source_sha || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate source commit SHA
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source commit SHA" >&2
            exit 2
          fi
          printf 'sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout requested source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify application source tree
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_APP_SOURCE_SHA: ${{ github.event.pull_request.base.sha || inputs.source_sha || github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$EXPECTED_APP_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid expected application source SHA" >&2
            exit 2
          fi
          git fetch --no-tags --depth=1 origin "$EXPECTED_APP_SOURCE_SHA"
          built_tree="$(git rev-parse "$SOURCE_SHA:app")"
          expected_tree="$(git rev-parse "$EXPECTED_APP_SOURCE_SHA:app")"
          if [[ "$built_tree" != "$expected_tree" ]]; then
            echo "Application tree differs from the intended source commit" >&2
            echo "built_app_tree=$built_tree" >&2
            echo "expected_app_tree=$expected_tree" >&2
            exit 1
          fi
          echo "source_commit=$EXPECTED_APP_SOURCE_SHA"
          echo "app_tree_sha=$expected_tree"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend runtime dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install locked dependencies
        working-directory: app
        run: npm ci

      - name: Test temporary npm audit exception policy
        run: node --test tools/test_npm_audit_policy.mjs

      - name: Audit frontend dependencies
        working-directory: app
        run: node ../tools/check_npm_audit.mjs

      - name: Lint frontend
        working-directory: app
        run: npm run lint

      - name: Check formatting
        working-directory: app
        run: npm run format:check

      - name: Typecheck frontend
        working-directory: app
        run: npm run typecheck

      - name: Run unit tests
        working-directory: app
        run: npm test

      - name: Build production frontend
        working-directory: app
        run: npm run build

      - name: Smoke-check Vite proxy against backend health
        working-directory: app
        shell: bash
        run: |
          python -m uvicorn app.main:app --app-dir ../backend --host 127.0.0.1 --port 8000 > /tmp/sentinel-api.log 2>&1 &
          api_pid=$!
          npm run dev -- --port 4173 --strictPort > /tmp/sentinel-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /tmp/sentinel-dev.html; then
              break
            fi
            sleep 1
          done
          grep -q '<div id="app"></div>' /tmp/sentinel-dev.html
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/api/v1/health > /tmp/sentinel-health.json; then
              break
            fi
            sleep 1
          done
          python -c "import json; data=json.load(open('/tmp/sentinel-health.json')); assert data['status'] == 'ok' and data['app_version']"

      - name: Validate Docker Compose configuration
        run: docker compose -f compose.yaml config --quiet

      - name: Verify development ports are bound to localhost
        run: |
          docker compose -f compose.yaml config --format json > /tmp/sentinel-compose.json
          python - <<'PY'
          import json

          with open("/tmp/sentinel-compose.json", encoding="utf-8") as config_file:
              config = json.load(config_file)

          expected_ports = {"api": 8000, "web": 5173}
          for service_name, expected_port in expected_ports.items():
              ports = config["services"][service_name].get("ports", [])
              assert len(ports) == 1, f"{service_name}: expected exactly one published port"
              port = ports[0]
              assert port.get("host_ip") == "127.0.0.1", (
                  f"{service_name}: port must bind to localhost, got {port.get('host_ip')!r}"
              )
              assert int(port["published"]) == expected_port
              assert int(port["target"]) == expected_port
          PY

      - name: Start Docker Compose development stack
        run: docker compose -f compose.yaml up -d --wait --wait-timeout 180

      - name: Smoke-check frontend and API proxy inside Compose
        run: |
          curl --fail --silent --show-error http://127.0.0.1:5173/ > /tmp/sentinel-compose-web.html
          grep -q '<div id="app"></div>' /tmp/sentinel-compose-web.html
          docker compose -f compose.yaml exec -T web node -e "fetch('http://127.0.0.1:5173/api/v1/health').then(async (response) => { if (!response.ok) throw new Error('HTTP ' + response.status); const data = await response.json(); if (data.status !== 'ok' || !data.app_version || !data.timestamp) throw new Error('Unexpected health response'); }).catch((error) => { console.error(error); process.exit(1); })"

      - name: Stop Docker Compose development stack
        if: always()
        run: docker compose -f compose.yaml down --volumes

      - name: Validate preview Compose configuration
        run: docker compose -f deployment/compose.preview.yaml config --quiet

      - name: Start hardened preview stack
        run: docker compose -p sentinel-preview -f deployment/compose.preview.yaml up -d --build --wait --wait-timeout 240

      - name: Smoke-check preview frontend and API
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error http://127.0.0.1:8080/ > /tmp/sentinel-preview-index.html
          grep -q '<div id="app"></div>' /tmp/sentinel-preview-index.html
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health > /tmp/sentinel-preview-health.json
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/sentinel-preview-health.json").read_text(encoding="utf-8"))
          assert health["status"] == "ok"
          assert health["app_version"] == "0.1.0-preview"
          assert health["timestamp"]
          PY
          status="$(curl --silent --show-error --output /tmp/sentinel-preview-catalog-error.json --write-out '%{http_code}' -H 'Content-Type: application/json' --data-binary '{"bbox":[56.0,57.0,58.0,59.0],"datetime":{"from":"2025-06-01T00:00:00Z","to":"2025-09-01T23:59:59Z"},"cloud_cover_lte":20,"collections":["sentinel-2-l2a"],"providers":null,"limit":20,"cursor":null}' http://127.0.0.1:8080/api/v1/catalog/search)"
          test "$status" = "503"
          python - <<'PY'
          import json
          from pathlib import Path

          error = json.loads(Path("/tmp/sentinel-preview-catalog-error.json").read_text(encoding="utf-8"))
          assert error["error"]["code"] == "PROVIDER_UNAVAILABLE"
          assert error["error"]["request_id"]
          PY

      - name: Stop hardened preview stack
        if: always()
        run: docker compose -p sentinel-preview -f deployment/compose.preview.yaml down --volumes
      - name: Create release manifest and SHA-256 checksums
        working-directory: app
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_APP_SOURCE_SHA: ${{ github.event.pull_request.base.sha || inputs.source_sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test -s dist/index.html
          app_tree_sha="$(git rev-parse "$EXPECTED_APP_SOURCE_SHA:app")"
          python - "$EXPECTED_APP_SOURCE_SHA" "$SOURCE_SHA" "$app_tree_sha" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_REPOSITORY" "$GITHUB_WORKFLOW_REF" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          source_sha, build_sha, app_tree_sha, run_id, run_attempt, repository, workflow_ref = sys.argv[1:]
          manifest = {
              "schema_version": 1,
              "repository": repository,
              "source_commit_sha": source_sha,
              "build_commit_sha": build_sha,
              "app_tree_sha": app_tree_sha,
              "workflow_ref": workflow_ref,
              "workflow_run_id": int(run_id),
              "workflow_run_attempt": int(run_attempt),
              "built_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          Path("dist/release-manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd dist
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Upload verified production frontend artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sentinel-explorer-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
