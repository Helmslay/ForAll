name: Tools offline tests

on:
  push:
    branches:
      - main
    paths:
      - "tools/**"
      - ".github/workflows/tools-offline-tests.yml"
      - ".github/workflows/sentinel-control-command-approval.yml"
  pull_request:
    paths:
      - "tools/**"
      - ".github/workflows/tools-offline-tests.yml"
      - ".github/workflows/sentinel-control-command-approval.yml"

permissions:
  contents: read

concurrency:
  group: tools-offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run offline tools tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v

      - name: Compile diagnostic tools
        run: python -m py_compile tools/check_stac.py tools/test_check_stac.py tools/search_stac.py tools/test_search_stac.py tools/sentinel_control_relay/approval.py tools/sentinel_control_relay/test_approval.py
