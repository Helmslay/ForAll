name: Docker Compose dev

on:
  pull_request:
    paths:
      - "compose.yaml"
      - "app/**"
      - "backend/**"
      - ".github/workflows/compose-dev.yml"

permissions:
  contents: read

concurrency:
  group: compose-dev-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config --quiet

      - name: Start development services
        run: docker compose -f compose.yaml up -d --wait --wait-timeout 180

      - name: Verify frontend and proxied backend health
        run: |
          curl --fail --silent --show-error http://127.0.0.1:5173/ > /tmp/sentinel-web.html
          grep -q '<div id="app"></div>' /tmp/sentinel-web.html
          docker compose -f compose.yaml exec -T web node -e "fetch('http://127.0.0.1:5173/api/v1/health').then(async (response) => { if (!response.ok) throw new Error('HTTP ' + response.status); const data = await response.json(); if (data.status !== 'ok' || !data.app_version || !data.timestamp) throw new Error('Unexpected health response'); }).catch((error) => { console.error(error); process.exit(1); })"

      - name: Stop development services
        if: always()
        run: docker compose -f compose.yaml down --volumes
