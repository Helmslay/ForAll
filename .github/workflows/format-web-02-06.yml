name: WEB-02.06 temporary Vue formatting

on:
  push:
    branches:
      - work/web-02-06-coordinates-resolution
    paths:
      - .github/workflows/format-web-02-06.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/web-02-06-coordinates-resolution
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        working-directory: app
        run: npm ci
      - name: Format component
        working-directory: app
        run: npx prettier --write src/components/MapCanvas.vue
      - name: Commit formatted component
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/components/MapCanvas.vue
          if ! git diff --cached --quiet; then
            git commit -m "style(web): format map readout component"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
