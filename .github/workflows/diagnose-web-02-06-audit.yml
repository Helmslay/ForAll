name: WEB-02.06 temporary audit diagnostics

on:
  push:
    branches:
      - work/web-02-06-coordinates-resolution
    paths:
      - .github/workflows/diagnose-web-02-06-audit.yml

permissions:
  contents: read

jobs:
  audit-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        working-directory: app
        run: npm ci
      - name: Print npm audit advisory details without changing policy
        working-directory: app
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
            console.log(JSON.stringify(report.vulnerabilities ?? {}, null, 2));
          '
